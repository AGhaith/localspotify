<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Subsonic Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6313bc;
      --primary-light: #8b5cf6;
      --primary-gradient: linear-gradient(135deg, #6313bc 0%, #a855f7 100%);
      --bg: #0d0d12;
      --card-bg: rgba(26, 26, 36, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #22c55e;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .background-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 19, 188, 0.25) 0%, rgba(13, 13, 18, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.5rem 1.75rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo-container {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .logo-icon {
      width: 84px;
      height: 84px;
      background: var(--primary-gradient);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(99, 19, 188, 0.4);
      animation: float 3s ease-in-out infinite;
    }

    .logo-icon svg {
      width: 46px;
      height: 46px;
      stroke: #ffffff;
      stroke-width: 1.8;
      fill: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .app-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    /* Loader */
    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 0.92rem;
      font-weight: 500;
      color: #e2e8f0;
    }

    /* Config Screen (Fallback / Manual Server setup) */
    .config-card {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 1.2rem;
      text-align: left;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-label {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(15, 15, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
    }

    .btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: 0 4px 15px rgba(99, 19, 188, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(99, 19, 188, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.12);
    }

    .error-msg {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 0.25rem;
      text-align: center;
    }

    .footer-links {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="background-glow"></div>

  <div class="container">
    <div class="logo-container">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 13.5V13c0-4.97 3.582-9 8-9s8 4.03 8 9v.5"></path>
          <path d="M2 17.439v-1.877a2 2 0 0 1 1.515-1.94L4 13.5l1.254-.314a.6.6 0 0 1 .746.582v5.464a.6.6 0 0 1-.746.582l-1.74-.435A2 2 0 0 1 2 17.439ZM22 17.439v-1.877a2 2 0 0 0-1.515-1.94L20 13.5l-1.255-.314a.6.6 0 0 0-.745.582v5.464a.6.6 0 0 0 .745.582l1.74-.435A2 2 0 0 0 22 17.439Z"></path>
        </svg>
      </div>
    </div>

    <h1 class="app-title">Subsonic Player</h1>
    <p class="app-subtitle" id="sub-desc">Connecting to music server...</p>

    <!-- State 1: Connecting Spinner -->
    <div id="loader-section" class="loader-wrapper">
      <div class="spinner"></div>
      <p id="status-text" class="status-text">Connecting to server...</p>
    </div>

    <!-- State 2: Connection Failed / Server Configuration -->
    <div id="config-section" class="config-card">
      <div class="input-group">
        <label class="input-label" for="server-input">Subsonic Player URL</label>
        <input type="url" id="server-input" class="input-field" placeholder="http://100.92.248.49:6969" value="http://100.92.248.49:6969" />
      </div>

      <p id="error-banner" class="error-msg" style="display: none;"></p>

      <button id="connect-btn" class="btn btn-primary">
        <span>Connect to Player</span>
      </button>

      <button id="retry-default-btn" class="btn btn-secondary">
        <span>Reset to Default (100.92.248.49:6969)</span>
      </button>
    </div>

    <div class="footer-links">
      <span>Subsonic / Navidrome Client v1.0.0</span>
    </div>
  </div>

  <script>
    const DEFAULT_SERVER_URL = "http://100.92.248.49:6969";
    const STORAGE_KEY = "subsonic_player_server_url";

    const loaderSection = document.getElementById("loader-section");
    const configSection = document.getElementById("config-section");
    const statusText = document.getElementById("status-text");
    const subDesc = document.getElementById("sub-desc");
    const serverInput = document.getElementById("server-input");
    const connectBtn = document.getElementById("connect-btn");
    const retryDefaultBtn = document.getElementById("retry-default-btn");
    const errorBanner = document.getElementById("error-banner");

    function getTargetUrl() {
      let saved = localStorage.getItem(STORAGE_KEY);
      if (!saved || saved.trim() === "") {
        return DEFAULT_SERVER_URL;
      }
      return saved.trim().replace(/\/+$/, "");
    }

    function showConfigUI(errorMessage) {
      loaderSection.style.display = "none";
      configSection.style.display = "flex";
      subDesc.textContent = "Server Connection Settings";
      serverInput.value = getTargetUrl();
      if (errorMessage) {
        errorBanner.textContent = errorMessage;
        errorBanner.style.display = "block";
      } else {
        errorBanner.style.display = "none";
      }
    }

    function tryConnect(url) {
      if (!url || !url.startsWith("http")) {
        showConfigUI("Please enter a valid URL starting with http:// or https://");
        return;
      }

      loaderSection.style.display = "flex";
      configSection.style.display = "none";
      statusText.textContent = `Loading ${url}...`;
      subDesc.textContent = "Connecting to music server...";

      localStorage.setItem(STORAGE_KEY, url);

      // Fast check before redirect
      const timeoutId = setTimeout(() => {
        // Redirect directly to the full Nuxt web app
        window.location.replace(url);
      }, 400);

      // Timeout fallback if navigation doesn't happen
      setTimeout(() => {
        showConfigUI("Unable to load server. Check that the server is online and reachable from your network.");
      }, 5000);
    }

    connectBtn.addEventListener("click", () => {
      const url = serverInput.value.trim().replace(/\/+$/, "");
      tryConnect(url);
    });

    serverInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        connectBtn.click();
      }
    });

    retryDefaultBtn.addEventListener("click", () => {
      serverInput.value = DEFAULT_SERVER_URL;
      tryConnect(DEFAULT_SERVER_URL);
    });

    // Auto connect on startup
    window.addEventListener("DOMContentLoaded", () => {
      const initialUrl = getTargetUrl();
      tryConnect(initialUrl);
    });
  </script>
</body>
</html>
