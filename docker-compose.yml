services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "6767:4533"
    environment:
      ND_MUSICFOLDER: "/music"
      ND_DATAFOLDER: "/data"
      ND_SCROBBLE: "true"
      ND_ENABLEPLAYLISTS: "true"
      ND_ENABLECORS: "true"
      ND_CORS_ALLOWEDORIGINS: "*"
      ND_ENABLEEXTERNALSERVICES: "true"
      ND_LASTFM_ENABLED: "true"
      ND_LASTFM_APIKEY: "8cd4f9a0768e6bb7cf406566a7803a01"
      ND_LASTFM_SECRET: "a5664985efd44e5cc350f24fd6d401f3"
    volumes:
      - ./navidrome-data:/data
      - ./my-music:/music:ro
  redis:
    image: redis:7-alpine
    container_name: localspotify-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  subsonic-player:
    build:
      context: ./subsonic-player
      dockerfile: Dockerfile
      network: host
    container_name: subsonic-player
    restart: unless-stopped
    ports:
      - "6969:3000"
    environment:
      - NUXT_PUBLIC_SERVER_URL=http://100.92.248.49:6767
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy